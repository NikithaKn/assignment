name: Auto Tag from Sprint Branch & Update Confluence

on:
  workflow_dispatch:
    inputs:
      sprint_branch:
        description: 'Sprint/release branch (e.g. 26.7.x)'
        required: true
        type: string
      confluence_space_key:
        description: 'Confluence space key to hold the per-line "Release Notes - <line>" page'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
      CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
      CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ✅ Checkout branch
      - name: Checkout sprint branch
        run: |
          git fetch origin
          git checkout -B "${{ github.event.inputs.sprint_branch }}" "origin/${{ github.event.inputs.sprint_branch }}"

      # ✅ Generate tag
      - name: Generate tag
        id: tag
        run: |
          PREFIX=$(echo "${{ github.event.inputs.sprint_branch }}" | sed 's/\.x$//')
          LAST_TAG=$(git tag --list "${PREFIX}.*" --sort=-v:refname | head -n 1)

          if [ -z "$LAST_TAG" ]; then
            NEXT=0
          else
            LAST_NUM=$(echo "$LAST_TAG" | awk -F'.' '{print $3}')
            NEXT=$((LAST_NUM + 1))
          fi

          echo "new_tag=${PREFIX}.${NEXT}" >> "$GITHUB_OUTPUT"

          # Previous tag on this line (for commit-range attribution). Empty on the first cut.
          if [ "$NEXT" -gt 0 ]; then PREV="${PREFIX}.$((NEXT - 1))"; else PREV=""; fi
          echo "prev_tag=${PREV}" >> "$GITHUB_OUTPUT"

      # ✅ Notify Release Freeze Window Started
      - name: Notify Release Freeze Window
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

        run: |
          TAG_NAME="${{ steps.tag.outputs.new_tag }}"

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          jq -n \
            --arg tag "$TAG_NAME" \
            --arg branch "${{ github.event.inputs.sprint_branch }}" \
            --arg run "$RUN_URL" \
            '{
              type: "message",
              attachments: [
                {
                  contentType: "application/vnd.microsoft.card.adaptive",
                  content: {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    type: "AdaptiveCard",
                    version: "1.4",
                    body: [
                      {
                        type: "TextBlock",
                        size: "Large",
                        weight: "Bolder",
                        text: "⏳ Release Freeze Window Started"
                      },
                      {
                        type: "TextBlock",
                        text: ("Upcoming Tag: " + $tag)
                      },
                      {
                        type: "TextBlock",
                        text: ("Branch: " + $branch)
                      },
                      {
                        type: "TextBlock",
                        wrap: true,
                        text: "Tag cut will happen after 20 mins.\nIf hotfix PRs are still open against this branch, release will wait automatically."
                      }
                    ],
                    actions: [
                      {
                        type: "Action.OpenUrl",
                        title: "View Workflow",
                        url: $run
                      }
                    ]
                  }
                }
              ]
            }' > payload.json

          curl --location --request POST "$TEAMS_WEBHOOK_URL" \
            --header "Content-Type: application/json" \
            --data @payload.json

      # ✅ Initial Release Hold
      - name: Initial Release Hold
        run: sleep 10

      # ✅ Refresh branch after hotfix merges
      - name: Refresh sprint branch
        run: |
          git fetch origin
          git checkout "${{ github.event.inputs.sprint_branch }}"
          git reset --hard "origin/${{ github.event.inputs.sprint_branch }}"

      # ✅ Fetch Jira IDs From Fix Version
      - name: Fetch Jira IDs From Fix Version
        run: |

          FIX_VERSION="${{ steps.tag.outputs.new_tag }}"

          AUTH=$(echo -n "$JIRA_EMAIL:$JIRA_API_TOKEN" | base64 -w 0)

          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Basic $AUTH" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "$(jq -n \
              --arg jql "cf[10104] = \"$FIX_VERSION\"" \
              '{jql:$jql,fields:["key"],maxResults:1000}')" \
            "$JIRA_BASE_URL/rest/api/3/search/jql")

          # Tagged set (cf[10104]) kept SEPARATE so we can classify ticket source later.
          echo "$RESPONSE" | jq -r '.issues[].key' > cf_ids.txt

          echo "Tagged (cf[10104]) tickets:"
          cat cf_ids.txt

      # ✅ Wait Until Hotfix PRs Are Merged
      - name: Wait Until Hotfix PRs Are Merged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

        run: |

          while true
          do
            COUNT=$(gh pr list \
              --base "${{ github.event.inputs.sprint_branch }}" \
              --state open \
              --json number,title \
              --jq 'length')

            echo "Open PR Count: $COUNT"

            if [ "$COUNT" -eq 0 ]; then
              echo "No open PRs remaining"
              break
            fi

            echo "Open PRs found. Waiting another 10 mins..."

            jq -n \
              --arg count "$COUNT" \
              --arg branch "${{ github.event.inputs.sprint_branch }}" \
              '{
                type: "message",
                attachments: [
                  {
                    contentType: "application/vnd.microsoft.card.adaptive",
                    content: {
                      "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                      type: "AdaptiveCard",
                      version: "1.4",
                      body: [
                        {
                          type: "TextBlock",
                          size: "Medium",
                          weight: "Bolder",
                          text: "⏳ Release Hold Extended"
                        },
                        {
                          type: "TextBlock",
                          text: ("Open PRs detected against " + $branch)
                        },
                        {
                          type: "TextBlock",
                          text: ("Current Open PR Count: " + $count)
                        },
                        {
                          type: "TextBlock",
                          wrap: true,
                          text: "Tag cut will continue automatically once PRs are merged."
                        }
                      ]
                    }
                  }
                ]
              }' > payload.json

            curl --location --request POST "$TEAMS_WEBHOOK_URL" \
              --header "Content-Type: application/json" \
              --data @payload.json

            sleep 600
          done

      # ✅ Collect Jira IDs from commits SINCE THE PREVIOUS TAG
      #    (catches work that was merged but where the fix version wasn't set)
      - name: Collect commit Jira IDs (since previous tag)
        run: |
          PREV="${{ steps.tag.outputs.prev_tag }}"
          if [ -n "$PREV" ] && git rev-parse "$PREV" >/dev/null 2>&1; then
            RANGE="$PREV..HEAD"
          else
            RANGE="HEAD"   # first cut on the line — take everything reachable
          fi
          echo "Commit range: $RANGE"
          git log $RANGE --pretty=format:"%s %b" \
            | grep -oiE '[A-Z]+-[0-9]+' | tr 'a-z' 'A-Z' | sort -u > commit_ids.txt || true
          echo "Commit-derived tickets:"; cat commit_ids.txt

      # ✅ Union cf[10104] ∪ commit IDs → jira_ids.txt (full set for table + epics)
      - name: Build union ticket list
        run: |
          cat cf_ids.txt commit_ids.txt 2>/dev/null | sed '/^$/d' | sort -u > jira_ids.txt
          echo "Union tickets:"; cat jira_ids.txt

      # ✅ Build Jira Table (HTML for Confluence) — with combined-source classification
      #    Source: "Tagged + merged" (cf ∩ commits), "Tagged · not merged" (cf only,
      #    work pending), "Merged · fix version missing" (commits only, data gap).
      - name: Build Jira Table
        run: |
          echo "<table><tbody>" > jira_table.html
          echo "<tr><th>Ticket</th><th>Status</th><th>Source</th></tr>" >> jira_table.html

          while read -r ticket; do
            [ -z "$ticket" ] && continue

            RESPONSE=$(curl -s -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
              "$JIRA_BASE_URL/rest/api/3/issue/$ticket?fields=status")

            STATUS=$(echo "$RESPONSE" | jq -r '.fields.status.name // "Unknown"')
            LINK="$JIRA_BASE_URL/browse/$ticket"

            grep -qx "$ticket" cf_ids.txt     && IN_CF=yes     || IN_CF=no
            grep -qx "$ticket" commit_ids.txt && IN_COMMIT=yes || IN_COMMIT=no
            if   [ "$IN_CF" = yes ] && [ "$IN_COMMIT" = yes ]; then SRC="Tagged + merged"
            elif [ "$IN_CF" = yes ];                            then SRC="Tagged · not merged"
            else                                                    SRC="Merged · fix version missing"
            fi

            echo "<tr><td><a href=\"$LINK\">$ticket</a></td><td>$STATUS</td><td>$SRC</td></tr>" >> jira_table.html
          done < jira_ids.txt

          echo "</tbody></table>" >> jira_table.html

      # ✅ Fetch Epic Summaries
      - name: Fetch Epic Summaries
        id: epic
        run: |
          echo "[]" > release_notes.json

          while read -r ticket; do
            [ -z "$ticket" ] && continue

            RESPONSE=$(curl -s -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
              "$JIRA_BASE_URL/rest/api/3/issue/$ticket?fields=issuetype,parent")

            TYPE=$(echo "$RESPONSE" | jq -r '.fields.issuetype.name')

            if [ "$TYPE" != "Story" ]; then
              continue
            fi

            EPIC_KEY=$(echo "$RESPONSE" | jq -r '.fields.parent.key // empty')
            [ -z "$EPIC_KEY" ] && continue

            EPIC_RESPONSE=$(curl -s -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
              "$JIRA_BASE_URL/rest/api/3/issue/$EPIC_KEY?fields=summary,description")

            EPIC_SUMMARY=$(echo "$EPIC_RESPONSE" | jq -r '.fields.summary // ""')

            EPIC_DESC=$(echo "$EPIC_RESPONSE" | jq -r '
              def extract:
                if type=="object" and has("content") then
                  .content[] | extract
                elif type=="object" and has("text") then
                  .text
                else empty end;
              .fields.description | extract' | tr "\n" " ")

            SHORT=$(echo "$EPIC_DESC" | awk '{for(i=1;i<=15 && i<=NF;i++) printf $i" ";}')

            # De-duplicate by epic key before appending
            EXISTS=$(jq --arg k "$EPIC_KEY" 'any(.[]; .epic == $k)' release_notes.json)
            if [ "$EXISTS" = "false" ]; then
              jq \
                --arg epic    "$EPIC_KEY"     \
                --arg title   "$EPIC_SUMMARY" \
                --arg short   "$SHORT"        \
                '. += [{"epic":$epic,"title":$title,"short":$short}]' \
                release_notes.json > tmp.json && mv tmp.json release_notes.json
            fi

          done < jira_ids.txt

          echo "epics=$(jq -c . release_notes.json)" >> "$GITHUB_OUTPUT"

      # ✅ Update Confluence — resolve the per-line page by TITLE, update or create
      #    Release line = sprint branch minus the trailing segment (26.7.x -> 26.7).
      #    Target page title = "Release Notes - <line>". Found -> prepend & update;
      #    not found -> create and populate. The resolved page id/URL is exported
      #    for the later Teams notification.
      - name: Update Confluence
        env:
          SPACE_KEY: ${{ github.event.inputs.confluence_space_key }}
        run: |
          TAG=${{ steps.tag.outputs.new_tag }}
          LINE=$(echo "${{ github.event.inputs.sprint_branch }}" | sed -E 's/\.[^.]*$//')
          PAGE_TITLE="Release Notes - $LINE"
          echo "Release line: $LINE  →  page title: \"$PAGE_TITLE\" (space $SPACE_KEY)"

          TABLE=$(cat jira_table.html)
          EPICS_JSON=$(printf '%s' '${{ steps.epic.outputs.epics }}')
          EPIC_HTML=$(echo "$EPICS_JSON" | jq -r '
            "<ul>" + (map("<li><b>" + .epic + "</b>: " + .short + "</li>") | join("")) + "</ul>"')
          DATE=$(date)

          NEW_SECTION="<hr/><h2>Release $TAG</h2><p><b>Date:</b> $DATE</p>"
          NEW_SECTION+="<h3>Epic Highlights</h3>$EPIC_HTML<h3>Jira Tickets</h3>$TABLE"

          TITLE_JSON=$(printf '%s' "$PAGE_TITLE" | jq -Rs .)

          # Find an existing page with this title in the space
          FOUND=$(curl -s -G -u "$CONFLUENCE_EMAIL:$CONFLUENCE_API_TOKEN" \
            --data-urlencode "title=$PAGE_TITLE" \
            --data-urlencode "spaceKey=$SPACE_KEY" \
            --data-urlencode "type=page" \
            --data-urlencode "expand=version,body.storage" \
            "$CONFLUENCE_BASE_URL/wiki/rest/api/content")
          PAGE_ID=$(echo "$FOUND" | jq -r '.results[0].id // empty')

          if [ -n "$PAGE_ID" ]; then
            VERSION=$(echo "$FOUND" | jq -r '.results[0].version.number')
            EXISTING=$(echo "$FOUND" | jq -r '.results[0].body.storage.value')
            NEW_VERSION=$((VERSION + 1))
            ESCAPED=$(printf '%s' "$NEW_SECTION $EXISTING" | jq -Rs .)
            echo "Found \"$PAGE_TITLE\" (id=$PAGE_ID, v$VERSION) — prepending Release $TAG, updating to v$NEW_VERSION"
            RESULT=$(curl -s -u "$CONFLUENCE_EMAIL:$CONFLUENCE_API_TOKEN" -X PUT \
              "$CONFLUENCE_BASE_URL/wiki/rest/api/content/$PAGE_ID" \
              -H "Content-Type: application/json" \
              -d "{\"id\":\"$PAGE_ID\",\"type\":\"page\",\"title\":$TITLE_JSON,\"version\":{\"number\":$NEW_VERSION},\"body\":{\"storage\":{\"value\":$ESCAPED,\"representation\":\"storage\"}}}")
          else
            echo "No page titled \"$PAGE_TITLE\" — creating and populating it"
            ESCAPED=$(printf '%s' "$NEW_SECTION" | jq -Rs .)
            RESULT=$(curl -s -u "$CONFLUENCE_EMAIL:$CONFLUENCE_API_TOKEN" -X POST \
              -H "Content-Type: application/json" \
              -d "{\"type\":\"page\",\"title\":$TITLE_JSON,\"space\":{\"key\":\"$SPACE_KEY\"},\"body\":{\"storage\":{\"value\":$ESCAPED,\"representation\":\"storage\"}}}" \
              "$CONFLUENCE_BASE_URL/wiki/rest/api/content")
            PAGE_ID=$(echo "$RESULT" | jq -r '.id // empty')
          fi

          if [ -z "$PAGE_ID" ] || [ "$(echo "$RESULT" | jq -r '.id // empty')" = "" ]; then
            echo "❌ Confluence update/create failed:"; echo "$RESULT" | jq '.' 2>/dev/null || echo "$RESULT"; exit 1
          fi

          # Export resolved page id + URL for later steps (Teams notification)
          echo "CONF_PAGE_ID=$PAGE_ID" >> "$GITHUB_ENV"
          echo "CONFLUENCE_URL=$CONFLUENCE_BASE_URL/pages/viewpage.action?pageId=$PAGE_ID" >> "$GITHUB_ENV"
          echo "✅ Confluence page \"$PAGE_TITLE\" id=$PAGE_ID is now v$(echo "$RESULT" | jq -r '.version.number')"

      # ✅ Create tag
      - name: Create tag
        run: |
          git tag ${{ steps.tag.outputs.new_tag }}
          git push origin ${{ steps.tag.outputs.new_tag }}

      # ✅ Send Teams Notification
      - name: Send Teams Notification
        if: success()
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}

        run: |
          TAG_NAME="${{ steps.tag.outputs.new_tag }}"

          DASHBOARD_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          # CONF_PAGE_ID was exported by the "Update Confluence" step (find-or-create by line)
          CONFLUENCE_URL="$CONFLUENCE_BASE_URL/pages/viewpage.action?pageId=${CONF_PAGE_ID}"

          jq -n \
            --arg tag  "$TAG_NAME"      \
            --arg conf "$CONFLUENCE_URL" \
            --arg dash "$DASHBOARD_URL"  \
            '{
              type: "message",
              attachments: [
                {
                  contentType: "application/vnd.microsoft.card.adaptive",
                  content: {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    type: "AdaptiveCard",
                    version: "1.4",
                    body: [
                      {
                        type: "TextBlock",
                        size: "Large",
                        weight: "Bolder",
                        text: "🚀 Release Successfully Created"
                      },
                      {
                        type: "TextBlock",
                        text: ("Tag: " + $tag)
                      }
                    ],
                    actions: [
                      {
                        type: "Action.OpenUrl",
                        title: "📄 Confluence",
                        url: $conf
                      },
                      {
                        type: "Action.OpenUrl",
                        title: "📊 Dashboard",
                        url: $dash
                      }
                    ]
                  }
                }
              ]
            }' > payload.json

          curl --location --request POST "$TEAMS_WEBHOOK_URL" \
            --header "Content-Type: application/json" \
            --data @payload.json
