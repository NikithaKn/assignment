name: Auto Tag from Sprint Branch & Update Confluence

on:
  workflow_dispatch:
    inputs:
      sprint_branch:
        required: true
        type: string
      confluence_page_id:
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
      CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
      CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ✅ Checkout branch
      - name: Checkout sprint branch
        run: |
          git fetch origin
          git checkout -B "${{ github.event.inputs.sprint_branch }}" "origin/${{ github.event.inputs.sprint_branch }}"

      # ✅ Generate tag
      - name: Generate tag
        id: tag
        run: |
          PREFIX=$(echo "${{ github.event.inputs.sprint_branch }}" | sed 's/\.x$//')
          LAST_TAG=$(git tag --list "${PREFIX}.*" --sort=-v:refname | head -n 1)

          if [ -z "$LAST_TAG" ]; then
            NEXT=0
          else
            LAST_NUM=$(echo "$LAST_TAG" | awk -F'.' '{print $3}')
            NEXT=$((LAST_NUM + 1))
          fi

          echo "new_tag=${PREFIX}.${NEXT}" >> "$GITHUB_OUTPUT"
      # ✅ Notify Release Freeze Window Started
      - name: Notify Release Freeze Window
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

        run: |
          TAG_NAME="${{ steps.tag.outputs.new_tag }}"

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          jq -n \
            --arg tag "$TAG_NAME" \
            --arg branch "${{ github.event.inputs.sprint_branch }}" \
            --arg run "$RUN_URL" \
            '{
              type: "message",
              attachments: [
                {
                  contentType: "application/vnd.microsoft.card.adaptive",
                  content: {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    type: "AdaptiveCard",
                    version: "1.4",
                    body: [
                      {
                        type: "TextBlock",
                        size: "Large",
                        weight: "Bolder",
                        text: "⏳ Release Freeze Window Started"
                      },
                      {
                        type: "TextBlock",
                        text: ("Upcoming Tag: " + $tag)
                      },
                      {
                        type: "TextBlock",
                        text: ("Branch: " + $branch)
                      },
                      {
                        type: "TextBlock",
                        wrap: true,
                        text: "Tag cut will happen after 20 mins.\nIf hotfix PRs are still open against this branch, release will wait automatically."
                      }
                    ],
                    actions: [
                      {
                        type: "Action.OpenUrl",
                        title: "View Workflow",
                        url: $run
                      }
                    ]
                  }
                }
              ]
            }' > payload.json

          curl --location --request POST "$TEAMS_WEBHOOK_URL" \
            --header "Content-Type: application/json" \
            --data @payload.json
            
      # ✅ Initial Release Hold
      - name: Initial Release Hold
        run: sleep 120
        
      # ✅ Refresh branch after hotfix merges
      - name: Refresh sprint branch
        run: |
          git fetch origin
          git checkout "${{ github.event.inputs.sprint_branch }}"
          git reset --hard "origin/${{ github.event.inputs.sprint_branch }}"
      # ✅ Wait Until Hotfix PRs Are Merged
      - name: Wait Until Hotfix PRs Are Merged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

        run: |

          while true
          do
            COUNT=$(gh pr list \
              --base "${{ github.event.inputs.sprint_branch }}" \
              --state open \
              --json number,title \
              --jq 'length')

            echo "Open PR Count: $COUNT"

            if [ "$COUNT" -eq 2 ]; then
              echo "No open PRs remaining"
              break
            fi

            echo "Open PRs found. Waiting another 10 mins..."

            jq -n \
              --arg count "$COUNT" \
              --arg branch "${{ github.event.inputs.sprint_branch }}" \
              '{
                type: "message",
                attachments: [
                  {
                    contentType: "application/vnd.microsoft.card.adaptive",
                    content: {
                      "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                      type: "AdaptiveCard",
                      version: "1.4",
                      body: [
                        {
                          type: "TextBlock",
                          size: "Medium",
                          weight: "Bolder",
                          text: "⏳ Release Hold Extended"
                        },
                        {
                          type: "TextBlock",
                          text: ("Open PRs detected against " + $branch)
                        },
                        {
                          type: "TextBlock",
                          text: ("Current Open PR Count: " + $count)
                        },
                        {
                          type: "TextBlock",
                          wrap: true,
                          text: "Tag cut will continue automatically once PRs are merged."
                        }
                      ]
                    }
                  }
                ]
              }' > payload.json

            curl --location --request POST "$TEAMS_WEBHOOK_URL" \
              --header "Content-Type: application/json" \
              --data @payload.json

            sleep 600
          done

      # ✅ Get commits
      - name: Get commits
        run: |
          git log -20 --pretty=format:"%h|%s" > commits.txt

      # ✅ Extract Jira IDs
      - name: Extract Jira IDs
        run: |
          grep -oiE '[A-Z]+-[0-9]+' commits.txt | sort -u > jira_ids.txt || true

      # ✅ Build Jira Table
      - name: Build Jira Table
        run: |
          echo "<table><tbody>" > jira_table.html
          echo "<tr><th>Ticket</th><th>Status</th></tr>" >> jira_table.html

          while read -r ticket; do
            [ -z "$ticket" ] && continue

            RESPONSE=$(curl -s -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
              "$JIRA_BASE_URL/rest/api/3/issue/$ticket?fields=status")

            STATUS=$(echo "$RESPONSE" | jq -r '.fields.status.name // "Unknown"')
            LINK="$JIRA_BASE_URL/browse/$ticket"

            echo "<tr><td><a href=\"$LINK\">$ticket</a></td><td>$STATUS</td></tr>" >> jira_table.html
          done < jira_ids.txt

          echo "</tbody></table>" >> jira_table.html

      # ✅ Fetch Epic Summaries
      - name: Fetch Epic Summaries
        id: epic
        run: |
          echo "[]" > release_notes.json

          while read -r ticket; do
            [ -z "$ticket" ] && continue

            RESPONSE=$(curl -s -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
              "$JIRA_BASE_URL/rest/api/3/issue/$ticket?fields=issuetype,parent")

            TYPE=$(echo "$RESPONSE" | jq -r '.fields.issuetype.name')

            if [ "$TYPE" != "Story" ]; then
              continue
            fi

            EPIC_KEY=$(echo "$RESPONSE" | jq -r '.fields.parent.key // empty')
            [ -z "$EPIC_KEY" ] && continue

            EPIC_RESPONSE=$(curl -s -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
              "$JIRA_BASE_URL/rest/api/3/issue/$EPIC_KEY?fields=summary,description")

            EPIC_DESC=$(echo "$EPIC_RESPONSE" | jq -r '
              def extract:
                if type=="object" and has("content") then
                  .content[] | extract
                elif type=="object" and has("text") then
                  .text
                else empty end;
              .fields.description | extract' | tr "\n" " ")

            SHORT=$(echo "$EPIC_DESC" | awk '{for(i=1;i<=15 && i<=NF;i++) printf $i" ";}')

            jq --arg epic "$EPIC_KEY" --arg short "$SHORT" \
              '. += [{"epic":$epic,"short":$short}]' \
              release_notes.json > tmp.json && mv tmp.json release_notes.json

          done < jira_ids.txt

          echo "epics=$(jq -c . release_notes.json)" >> "$GITHUB_OUTPUT"

      # ✅ Update Confluence (NO HEREDOC → SAFE)
      - name: Update Confluence
        run: |
          PAGE_ID=${{ github.event.inputs.confluence_page_id }}
          TAG=${{ steps.tag.outputs.new_tag }}

          TABLE=$(cat jira_table.html)

          EPICS_JSON=$(printf '%s' '${{ steps.epic.outputs.epics }}')

          EPIC_HTML=$(echo "$EPICS_JSON" | jq -r '
            "<ul>" +
            (map("<li><b>" + .epic + "</b>: " + .short + "</li>") | join("")) +
            "</ul>"
          ')

          DATE=$(date)

          NEW_SECTION="<hr/>"
          NEW_SECTION+="<h2>Release $TAG</h2>"
          NEW_SECTION+="<p><b>Date:</b> $DATE</p>"
          NEW_SECTION+="<h3>Epic Highlights</h3>"
          NEW_SECTION+="$EPIC_HTML"
          NEW_SECTION+="<h3>Jira Tickets</h3>"
          NEW_SECTION+="$TABLE"

          RESPONSE=$(curl -s -u "$CONFLUENCE_EMAIL:$CONFLUENCE_API_TOKEN" \
            "$CONFLUENCE_BASE_URL/wiki/rest/api/content/$PAGE_ID?expand=body.storage,version")

          VERSION=$(echo "$RESPONSE" | jq -r '.version.number')
          NEW_VERSION=$((VERSION + 1))
          EXISTING=$(echo "$RESPONSE" | jq -r '.body.storage.value')

          FINAL="$NEW_SECTION $EXISTING"
          ESCAPED=$(printf '%s' "$FINAL" | jq -Rs .)

          curl -s -u "$CONFLUENCE_EMAIL:$CONFLUENCE_API_TOKEN" \
            -X PUT "$CONFLUENCE_BASE_URL/wiki/rest/api/content/$PAGE_ID" \
            -H "Content-Type: application/json" \
            -d "{\"id\":\"$PAGE_ID\",\"type\":\"page\",\"title\":\"Release Notes\",\"version\":{\"number\":$NEW_VERSION},\"body\":{\"storage\":{\"value\":$ESCAPED,\"representation\":\"storage\"}}}"

      # ✅ Create tag
      - name: Create tag
        run: |
          git tag ${{ steps.tag.outputs.new_tag }}
          git push origin ${{ steps.tag.outputs.new_tag }}

      - name: Build Confluence URL
        run: |
                CONFLUENCE_URL="${{ secrets.CONFLUENCE_BASE_URL }}/pages/viewpage.action?pageId=${{ github.event.inputs.confluence_page_id }}"
                echo "CONFLUENCE_URL=$CONFLUENCE_URL" >> $GITHUB_ENV
      - name: Update Dashboard JSON
        run: |
            mkdir -p docs/data
        
            cat > docs/data/releases.json <<EOF
            {
              "totalReleases": 13,
              "totalTickets": 52,
              "totalCommits": 140,
              "successRate": 99,
        
              "releases": [
                {
                  "tag": "${{ steps.tag.outputs.new_tag }}",
                  "date": "$(date +%Y-%m-%d)",
                  "tickets": 15,
                  "confluence": "${{ secrets.CONFLUENCE_URL }}"
                }
              ]
            }
            EOF
      - name: Commit Dashboard Changes
        run: |
              git config user.name "github-actions"
              git config user.email "github-actions@github.com"
          
              git add docs/data/releases.json
              git commit -m "Update release dashboard"
              git push
                
      - name: Send Teams Notification
        if: success()

        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}

        run: |
          TAG_NAME="${{ steps.tag.outputs.new_tag }}"
          PAGE_ID="${{ github.event.inputs.confluence_page_id }}"
      
          DASHBOARD_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          CONFLUENCE_URL="$CONFLUENCE_BASE_URL/pages/viewpage.action?pageId=$PAGE_ID"

            jq -n \
              --arg tag "$TAG_NAME" \
              --arg conf "$CONFLUENCE_URL" \
              --arg dash "$DASHBOARD_URL" \
              '{
                type: "message",
                attachments: [
                  {
                    contentType: "application/vnd.microsoft.card.adaptive",
                    content: {
                      "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                      type: "AdaptiveCard",
                      version: "1.4",
                      body: [
                        {
                          type: "TextBlock",
                          size: "Large",
                          weight: "Bolder",
                          text: "🚀 Release Successfully Created"
                        },
                        {
                          type: "TextBlock",
                          text: ("Tag: " + $tag)
                        }
                      ],
                      actions: [
                        {
                          type: "Action.OpenUrl",
                          title: "📄 Confluence",
                          url: $conf
                        },
                        {
                          type: "Action.OpenUrl",
                          title: "📊 Dashboard",
                          url: $dash
                        }
                      ]
                    }
                  }
                ]
              }' > payload.json
        
            curl --location --request POST "$TEAMS_WEBHOOK_URL" \
              --header "Content-Type: application/json" \
              --data @payload.json
              
