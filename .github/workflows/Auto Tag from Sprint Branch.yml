name: Auto Tag from Sprint Branch & Update Confluence

on:
  workflow_dispatch:
    inputs:
      sprint_branch:
        required: true
        type: string
      confluence_page_id:
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
      CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
      CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ✅ Checkout branch
      - name: Checkout sprint branch
        run: |
          git fetch origin
          git checkout -B "${{ github.event.inputs.sprint_branch }}" "origin/${{ github.event.inputs.sprint_branch }}"

      # ✅ Generate tag
      - name: Generate tag
        id: tag
        run: |
          PREFIX=$(echo "${{ github.event.inputs.sprint_branch }}" | sed 's/\.x$//')
          LAST_TAG=$(git tag --list "${PREFIX}.*" --sort=-v:refname | head -n 1)

          if [ -z "$LAST_TAG" ]; then
            NEXT=0
          else
            LAST_NUM=$(echo "$LAST_TAG" | awk -F'.' '{print $3}')
            NEXT=$((LAST_NUM + 1))
          fi

          echo "new_tag=${PREFIX}.${NEXT}" >> "$GITHUB_OUTPUT"

      # ✅ Notify Release Freeze Window Started
      - name: Notify Release Freeze Window
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

        run: |
          TAG_NAME="${{ steps.tag.outputs.new_tag }}"

          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          jq -n \
            --arg tag "$TAG_NAME" \
            --arg branch "${{ github.event.inputs.sprint_branch }}" \
            --arg run "$RUN_URL" \
            '{
              type: "message",
              attachments: [
                {
                  contentType: "application/vnd.microsoft.card.adaptive",
                  content: {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    type: "AdaptiveCard",
                    version: "1.4",
                    body: [
                      {
                        type: "TextBlock",
                        size: "Large",
                        weight: "Bolder",
                        text: "⏳ Release Freeze Window Started"
                      },
                      {
                        type: "TextBlock",
                        text: ("Upcoming Tag: " + $tag)
                      },
                      {
                        type: "TextBlock",
                        text: ("Branch: " + $branch)
                      },
                      {
                        type: "TextBlock",
                        wrap: true,
                        text: "Tag cut will happen after 20 mins.\nIf hotfix PRs are still open against this branch, release will wait automatically."
                      }
                    ],
                    actions: [
                      {
                        type: "Action.OpenUrl",
                        title: "View Workflow",
                        url: $run
                      }
                    ]
                  }
                }
              ]
            }' > payload.json

          curl --location --request POST "$TEAMS_WEBHOOK_URL" \
            --header "Content-Type: application/json" \
            --data @payload.json

      # ✅ Initial Release Hold
      - name: Initial Release Hold
        run: sleep 120

      # ✅ Refresh branch after hotfix merges
      - name: Refresh sprint branch
        run: |
          git fetch origin
          git checkout "${{ github.event.inputs.sprint_branch }}"
          git reset --hard "origin/${{ github.event.inputs.sprint_branch }}"

      # ✅ Wait Until Hotfix PRs Are Merged
      - name: Wait Until Hotfix PRs Are Merged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

        run: |

          while true
          do
            COUNT=$(gh pr list \
              --base "${{ github.event.inputs.sprint_branch }}" \
              --state open \
              --json number,title \
              --jq 'length')

            echo "Open PR Count: $COUNT"

            if [ "$COUNT" -eq 0 ]; then
              echo "No open PRs remaining"
              break
            fi

            echo "Open PRs found. Waiting another 10 mins..."

            jq -n \
              --arg count "$COUNT" \
              --arg branch "${{ github.event.inputs.sprint_branch }}" \
              '{
                type: "message",
                attachments: [
                  {
                    contentType: "application/vnd.microsoft.card.adaptive",
                    content: {
                      "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                      type: "AdaptiveCard",
                      version: "1.4",
                      body: [
                        {
                          type: "TextBlock",
                          size: "Medium",
                          weight: "Bolder",
                          text: "⏳ Release Hold Extended"
                        },
                        {
                          type: "TextBlock",
                          text: ("Open PRs detected against " + $branch)
                        },
                        {
                          type: "TextBlock",
                          text: ("Current Open PR Count: " + $count)
                        },
                        {
                          type: "TextBlock",
                          wrap: true,
                          text: "Tag cut will continue automatically once PRs are merged."
                        }
                      ]
                    }
                  }
                ]
              }' > payload.json

            curl --location --request POST "$TEAMS_WEBHOOK_URL" \
              --header "Content-Type: application/json" \
              --data @payload.json

            sleep 600
          done

      # ✅ Get commits
      - name: Get commits
        run: |
          git log -20 --pretty=format:"%h|%s" > commits.txt

      # ✅ Extract Jira IDs
      - name: Extract Jira IDs
        run: |
          grep -oiE '[A-Z]+-[0-9]+' commits.txt | sort -u > jira_ids.txt || true

      # ✅ Build Jira Table (HTML for Confluence — unchanged)
      - name: Build Jira Table
        run: |
          echo "<table><tbody>" > jira_table.html
          echo "<tr><th>Ticket</th><th>Status</th></tr>" >> jira_table.html

          while read -r ticket; do
            [ -z "$ticket" ] && continue

            RESPONSE=$(curl -s -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
              "$JIRA_BASE_URL/rest/api/3/issue/$ticket?fields=status")

            STATUS=$(echo "$RESPONSE" | jq -r '.fields.status.name // "Unknown"')
            LINK="$JIRA_BASE_URL/browse/$ticket"

            echo "<tr><td><a href=\"$LINK\">$ticket</a></td><td>$STATUS</td></tr>" >> jira_table.html
          done < jira_ids.txt

          echo "</tbody></table>" >> jira_table.html

      # ✅ Build rich Jira JSON for the dashboard (replaces old table-only approach)
      - name: Build Jira JSON for Dashboard
        id: jira
        run: |
          echo "[]" > tickets.json

          while read -r ticket; do
            [ -z "$ticket" ] && continue

            RESPONSE=$(curl -s -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
              "$JIRA_BASE_URL/rest/api/3/issue/$ticket?fields=summary,status,issuetype,priority,assignee")

            # Skip tickets that returned an error (e.g. access denied)
            ERROR=$(echo "$RESPONSE" | jq -r '.errorMessages[0] // empty')
            if [ -n "$ERROR" ]; then
              echo "Skipping $ticket: $ERROR"
              continue
            fi

            SUMMARY=$(echo  "$RESPONSE" | jq -r '.fields.summary        // "—"')
            STATUS=$(echo   "$RESPONSE" | jq -r '.fields.status.name    // "Unknown"')
            TYPE=$(echo     "$RESPONSE" | jq -r '.fields.issuetype.name // "Task"')
            PRIORITY=$(echo "$RESPONSE" | jq -r '.fields.priority.name  // "Medium"')
            ASSIGNEE=$(echo "$RESPONSE" | jq -r '.fields.assignee.displayName // "Unassigned"')
            LINK="$JIRA_BASE_URL/browse/$ticket"

            jq \
              --argjson arr "$(cat tickets.json)" \
              --arg id       "$ticket"   \
              --arg summary  "$SUMMARY"  \
              --arg status   "$STATUS"   \
              --arg type     "$TYPE"     \
              --arg priority "$PRIORITY" \
              --arg assignee "$ASSIGNEE" \
              --arg link     "$LINK"     \
              -n '$arr + [{id:$id,summary:$summary,status:$status,
                            type:$type,priority:$priority,
                            assignee:$assignee,link:$link}]' \
              > tmp.json && mv tmp.json tickets.json

          done < jira_ids.txt

          TICKET_COUNT=$(jq 'length' tickets.json)
          echo "ticket_count=$TICKET_COUNT" >> "$GITHUB_OUTPUT"

      # ✅ Fetch Epic Summaries
      - name: Fetch Epic Summaries
        id: epic
        run: |
          echo "[]" > release_notes.json

          while read -r ticket; do
            [ -z "$ticket" ] && continue

            RESPONSE=$(curl -s -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
              "$JIRA_BASE_URL/rest/api/3/issue/$ticket?fields=issuetype,parent")

            TYPE=$(echo "$RESPONSE" | jq -r '.fields.issuetype.name')

            if [ "$TYPE" != "Story" ]; then
              continue
            fi

            EPIC_KEY=$(echo "$RESPONSE" | jq -r '.fields.parent.key // empty')
            [ -z "$EPIC_KEY" ] && continue

            EPIC_RESPONSE=$(curl -s -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
              "$JIRA_BASE_URL/rest/api/3/issue/$EPIC_KEY?fields=summary,description")

            EPIC_SUMMARY=$(echo "$EPIC_RESPONSE" | jq -r '.fields.summary // ""')

            EPIC_DESC=$(echo "$EPIC_RESPONSE" | jq -r '
              def extract:
                if type=="object" and has("content") then
                  .content[] | extract
                elif type=="object" and has("text") then
                  .text
                else empty end;
              .fields.description | extract' | tr "\n" " ")

            SHORT=$(echo "$EPIC_DESC" | awk '{for(i=1;i<=15 && i<=NF;i++) printf $i" ";}')

            # De-duplicate by epic key before appending
            EXISTS=$(jq --arg k "$EPIC_KEY" 'any(.[]; .epic == $k)' release_notes.json)
            if [ "$EXISTS" = "false" ]; then
              jq \
                --arg epic    "$EPIC_KEY"     \
                --arg title   "$EPIC_SUMMARY" \
                --arg short   "$SHORT"        \
                '. += [{"epic":$epic,"title":$title,"short":$short}]' \
                release_notes.json > tmp.json && mv tmp.json release_notes.json
            fi

          done < jira_ids.txt

          echo "epics=$(jq -c . release_notes.json)" >> "$GITHUB_OUTPUT"

      # ✅ Update Confluence (unchanged)
      - name: Update Confluence
        run: |
          PAGE_ID=${{ github.event.inputs.confluence_page_id }}
          TAG=${{ steps.tag.outputs.new_tag }}

          TABLE=$(cat jira_table.html)

          EPICS_JSON=$(printf '%s' '${{ steps.epic.outputs.epics }}')

          EPIC_HTML=$(echo "$EPICS_JSON" | jq -r '
            "<ul>" +
            (map("<li><b>" + .epic + "</b>: " + .short + "</li>") | join("")) +
            "</ul>"
          ')

          DATE=$(date)

          NEW_SECTION="<hr/>"
          NEW_SECTION+="<h2>Release $TAG</h2>"
          NEW_SECTION+="<p><b>Date:</b> $DATE</p>"
          NEW_SECTION+="<h3>Epic Highlights</h3>"
          NEW_SECTION+="$EPIC_HTML"
          NEW_SECTION+="<h3>Jira Tickets</h3>"
          NEW_SECTION+="$TABLE"

          RESPONSE=$(curl -s -u "$CONFLUENCE_EMAIL:$CONFLUENCE_API_TOKEN" \
            "$CONFLUENCE_BASE_URL/wiki/rest/api/content/$PAGE_ID?expand=body.storage,version")

          VERSION=$(echo "$RESPONSE" | jq -r '.version.number')
          NEW_VERSION=$((VERSION + 1))
          EXISTING=$(echo "$RESPONSE" | jq -r '.body.storage.value')

          FINAL="$NEW_SECTION $EXISTING"
          ESCAPED=$(printf '%s' "$FINAL" | jq -Rs .)

          curl -s -u "$CONFLUENCE_EMAIL:$CONFLUENCE_API_TOKEN" \
            -X PUT "$CONFLUENCE_BASE_URL/wiki/rest/api/content/$PAGE_ID" \
            -H "Content-Type: application/json" \
            -d "{\"id\":\"$PAGE_ID\",\"type\":\"page\",\"title\":\"Release Notes\",\"version\":{\"number\":$NEW_VERSION},\"body\":{\"storage\":{\"value\":$ESCAPED,\"representation\":\"storage\"}}}"

      # ✅ Create tag
      - name: Create tag
        run: |
          git tag ${{ steps.tag.outputs.new_tag }}
          git push origin ${{ steps.tag.outputs.new_tag }}

      # ✅ Build Confluence URL
      - name: Build Confluence URL
        run: |
          CONFLUENCE_URL="${{ secrets.CONFLUENCE_BASE_URL }}/pages/viewpage.action?pageId=${{ github.event.inputs.confluence_page_id }}"
          echo "CONFLUENCE_URL=$CONFLUENCE_URL" >> $GITHUB_ENV

      # ✅ Ensure docs/ folder exists (index.html is committed directly in the repo under docs/)
      - name: Ensure docs folder exists
        run: |
          mkdir -p docs/data
          # docs/index.html must be committed to the repo at docs/index.html
          # It is NOT generated by this workflow — commit it once manually (see README).
          if [ ! -f docs/index.html ]; then
            echo "ERROR: docs/index.html not found in the repository."
            echo "Please commit the dashboard HTML file to docs/index.html on your default branch."
            echo "You can get it from: https://github.com/YOUR_ORG/YOUR_REPO/blob/main/docs/index.html"
            exit 1
          fi
          echo "docs/index.html found — OK"
      # ✅ Update Dashboard JSON (accumulates history — fixes the old overwrite bug)
      - name: Update Dashboard JSON
        run: |
          mkdir -p docs/data

          TAG="${{ steps.tag.outputs.new_tag }}"
          BRANCH="${{ github.event.inputs.sprint_branch }}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CONF_URL="${{ secrets.CONFLUENCE_BASE_URL }}/pages/viewpage.action?pageId=${{ github.event.inputs.confluence_page_id }}"
          TICKET_COUNT="${{ steps.jira.outputs.ticket_count }}"
          TICKETS_JSON="$(cat tickets.json)"
          EPICS_JSON="${{ steps.epic.outputs.epics }}"

          # Count how many tickets are "Done"
          DONE_COUNT=$(echo "$TICKETS_JSON" | jq '[.[] | select((.status|ascii_downcase) == "done" or (.status|ascii_downcase) == "closed" or (.status|ascii_downcase) == "resolved")] | length')

          # Build the new release entry
          NEW_ENTRY=$(jq -n \
            --arg  tag          "$TAG"          \
            --arg  branch       "$BRANCH"       \
            --arg  date         "$DATE"         \
            --arg  confluence   "$CONF_URL"     \
            --argjson ticket_count  "$TICKET_COUNT"  \
            --argjson tickets_done  "$DONE_COUNT"    \
            --argjson tickets       "$TICKETS_JSON"  \
            --argjson epics         "$EPICS_JSON"    \
            '{tag:$tag,branch:$branch,date:$date,confluence:$confluence,
              ticket_count:$ticket_count,tickets_done:$tickets_done,
              tickets:$tickets,epics:$epics}')

          # Load existing releases.json or start fresh
          if [ -f docs/data/releases.json ]; then
            EXISTING=$(cat docs/data/releases.json)
          else
            EXISTING='{"releases":[]}'
          fi

          # Remove any previous entry with the same tag (idempotent re-runs)
          # then prepend the new entry so latest is always first
          UPDATED=$(echo "$EXISTING" | jq \
            --argjson entry "$NEW_ENTRY" \
            '.releases = ([$entry] + [.releases[] | select(.tag != $entry.tag)])')

          echo "$UPDATED" > docs/data/releases.json
          echo "releases.json updated:"
          jq '.releases | length' docs/data/releases.json

      # ✅ Commit Dashboard Changes
      - name: Commit Dashboard Changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore: dashboard update for ${{ steps.tag.outputs.new_tag }}"
          git push

      # ✅ Send Teams Notification
      - name: Send Teams Notification
        if: success()
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}

        run: |
          TAG_NAME="${{ steps.tag.outputs.new_tag }}"
          PAGE_ID="${{ github.event.inputs.confluence_page_id }}"

          DASHBOARD_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          CONFLUENCE_URL="$CONFLUENCE_BASE_URL/pages/viewpage.action?pageId=$PAGE_ID"

          jq -n \
            --arg tag  "$TAG_NAME"      \
            --arg conf "$CONFLUENCE_URL" \
            --arg dash "$DASHBOARD_URL"  \
            '{
              type: "message",
              attachments: [
                {
                  contentType: "application/vnd.microsoft.card.adaptive",
                  content: {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    type: "AdaptiveCard",
                    version: "1.4",
                    body: [
                      {
                        type: "TextBlock",
                        size: "Large",
                        weight: "Bolder",
                        text: "🚀 Release Successfully Created"
                      },
                      {
                        type: "TextBlock",
                        text: ("Tag: " + $tag)
                      }
                    ],
                    actions: [
                      {
                        type: "Action.OpenUrl",
                        title: "📄 Confluence",
                        url: $conf
                      },
                      {
                        type: "Action.OpenUrl",
                        title: "📊 Dashboard",
                        url: $dash
                      }
                    ]
                  }
                }
              ]
            }' > payload.json

          curl --location --request POST "$TEAMS_WEBHOOK_URL" \
            --header "Content-Type: application/json" \
            --data @payload.json
