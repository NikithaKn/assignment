name: POC Auto Tag from Sprint Branch & Update Confluence

on:
  workflow_dispatch:
    inputs:
      sprint_branch:
        description: 'Sprint/release branch (e.g. 26.7.x)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
      CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
      CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ✅ Stage CI scripts from the default branch BEFORE we switch the working tree to the
      #    sprint branch (which was cut earlier and may not contain these scripts).
      - name: Stage CI scripts
        run: |
          mkdir -p "$RUNNER_TEMP/ci"
          cp scripts/fetch-release-tickets.sh "$RUNNER_TEMP/ci/"
          echo {{ CONFLUENCE_BASE_URL }}
          echo {{ CONFLUENCE_API_TOKEN }}

      # ✅ Checkout branch
      - name: Checkout sprint branch
        run: |
          git fetch origin
          git checkout -B "${{ github.event.inputs.sprint_branch }}" "origin/${{ github.event.inputs.sprint_branch }}"

      # ✅ Generate tag
      - name: Generate tag
        id: tag
        run: |
          PREFIX=$(echo "${{ github.event.inputs.sprint_branch }}" | sed 's/\.x$//')
          LAST_TAG=$(git tag --list "${PREFIX}.*" --sort=-v:refname | head -n 1)

          if [ -z "$LAST_TAG" ]; then
            NEXT=0
          else
            LAST_NUM=$(echo "$LAST_TAG" | awk -F'.' '{print $3}')
            NEXT=$((LAST_NUM + 1))
          fi

          echo "new_tag=${PREFIX}.${NEXT}" >> "$GITHUB_OUTPUT"

          # Previous tag on this line (for commit-range attribution). Empty on the first cut.
          if [ "$NEXT" -gt 0 ]; then PREV="${PREFIX}.$((NEXT - 1))"; else PREV=""; fi
          echo "prev_tag=${PREV}" >> "$GITHUB_OUTPUT"

      # ✅ Fetch + classify tickets (INITIAL snapshot, before the freeze notice)
      #    so the notification can list the open work the team must close before the cut.
      - name: Fetch release tickets (initial)
        run: bash "$RUNNER_TEMP/ci/fetch-release-tickets.sh" "${{ steps.tag.outputs.new_tag }}" "${{ steps.tag.outputs.prev_tag }}"

      # ✅ Notify Release Freeze Window Started — lists open work + assignees (anything not
      #    in a "done" status) as a FactSet so the team can finish/merge before the cut.
      - name: Notify Release Freeze Window
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

        run: |
          TAG_NAME="${{ steps.tag.outputs.new_tag }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          jq -n \
            --arg tag "$TAG_NAME" \
            --arg branch "${{ github.event.inputs.sprint_branch }}" \
            --arg run "$RUN_URL" \
            --slurpfile t tickets.json \
            '($t[0] // []) as $all
             | ($all | length) as $total
             | ([ $all[] | select(.statusCat=="done") ] | length) as $done
             | [ $all[] | select(.statusCat!="done") ] as $open
             | {
              type: "message",
              attachments: [
                {
                  contentType: "application/vnd.microsoft.card.adaptive",
                  content: {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    type: "AdaptiveCard",
                    version: "1.4",
                    body: (
                      [ {type:"TextBlock", size:"Large", weight:"Bolder", text:"⏳ Release Freeze Window Started"},
                        {type:"TextBlock", text:("Upcoming Tag: " + $tag)},
                        {type:"TextBlock", text:("Branch: " + $branch)},
                        {type:"TextBlock", wrap:true, text:(($total|tostring) + " ticket(s) in this release · " + ($done|tostring) + " done · " + (($open|length)|tostring) + " still open")} ]
                      + (if $total == 0
                         then [ {type:"TextBlock", wrap:true, text:"⚠️ No tickets are tagged for this release yet."} ]
                         elif ($open|length) > 0
                         then [ {type:"TextBlock", weight:"Bolder", wrap:true, text:"🔧 Open work — please complete & merge before the cut:"},
                                {type:"FactSet", facts: [ $open[] | {title:(.id + " · " + .status), value:("👤 " + .assignee + " — " + .summary)} ]} ]
                         else [ {type:"TextBlock", wrap:true, text:"✅ All tickets are in a Done status."} ] end)
                      + [ {type:"TextBlock", wrap:true, text:"Tag cut happens after the freeze window. Open hotfix PRs against this branch auto-extend the hold."} ]
                    ),
                    actions: [ {type:"Action.OpenUrl", title:"View Workflow", url:$run} ]
                  }
                }
              ]
            }' > payload.json

          curl --location --request POST "$TEAMS_WEBHOOK_URL" \
            --header "Content-Type: application/json" \
            --data @payload.json

      # ✅ Initial Release Hold
      - name: Initial Release Hold
        run: sleep 10

      # ✅ Wait Until Hotfix PRs Are Merged
      - name: Wait Until Hotfix PRs Are Merged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

        run: |

          while true
          do
            COUNT=$(gh pr list \
              --base "${{ github.event.inputs.sprint_branch }}" \
              --state open \
              --json number,title \
              --jq 'length')

            echo "Open PR Count: $COUNT"

            if [ "$COUNT" -eq 0 ]; then
              echo "No open PRs remaining"
              break
            fi

            echo "Open PRs found. Waiting another 10 mins..."

            jq -n \
              --arg count "$COUNT" \
              --arg branch "${{ github.event.inputs.sprint_branch }}" \
              '{
                type: "message",
                attachments: [
                  {
                    contentType: "application/vnd.microsoft.card.adaptive",
                    content: {
                      "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                      type: "AdaptiveCard",
                      version: "1.4",
                      body: [
                        {
                          type: "TextBlock",
                          size: "Medium",
                          weight: "Bolder",
                          text: "⏳ Release Hold Extended"
                        },
                        {
                          type: "TextBlock",
                          text: ("Open PRs detected against " + $branch)
                        },
                        {
                          type: "TextBlock",
                          text: ("Current Open PR Count: " + $count)
                        },
                        {
                          type: "TextBlock",
                          wrap: true,
                          text: "Tag cut will continue automatically once PRs are merged."
                        }
                      ]
                    }
                  }
                ]
              }' > payload.json

            curl --location --request POST "$TEAMS_WEBHOOK_URL" \
              --header "Content-Type: application/json" \
              --data @payload.json

            sleep 600
          done

      # ✅ Refresh branch after hotfix merges (so the final fetch sees merged commits)
      - name: Refresh sprint branch
        run: |
          git fetch origin
          git checkout "${{ github.event.inputs.sprint_branch }}"
          git reset --hard "origin/${{ github.event.inputs.sprint_branch }}"

      # ✅ Re-fetch + reclassify right before publishing, so any status / assignee / PR
      #    changes during the freeze window are reflected in Confluence and the dashboard.
      - name: Fetch release tickets (final, pre-publish)
        run: bash "$RUNNER_TEMP/ci/fetch-release-tickets.sh" "${{ steps.tag.outputs.new_tag }}" "${{ steps.tag.outputs.prev_tag }}"

      # ✅ Update Confluence — resolve the per-line page by TITLE, update or create
      #    Release line = sprint branch minus the trailing segment (26.7.x -> 26.7).
      #    Target page title = "Release Notes - <line>". Found -> prepend & update;
      #    not found -> create and populate. The resolved page id/URL is exported
      #    for the later Teams notification.
      - name: Update Confluence
        run: |
          SPACE_KEY="REL"                                   # constant Release Notes space
          TAG="${{ steps.tag.outputs.new_tag }}"
          PREV="${{ steps.tag.outputs.prev_tag }}"
          LINE=$(echo "${{ github.event.inputs.sprint_branch }}" | sed -E 's/\.[^.]*$//')
          BRANCH="${LINE}.x"
          PAGE_TITLE="Release Notes - $LINE"
          DATE_UTC=$(date -u +"%Y-%m-%d %H:%MZ")
          DASH_LINK="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/#${BRANCH}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PROV="Generated $DATE_UTC by GitHub Actions ($RUN_URL)"
          if [ -n "$PREV" ]; then COMPARE="https://github.com/${{ github.repository }}/compare/${PREV}...${TAG}"; else COMPARE=""; fi
          echo "Release line $LINE → \"$PAGE_TITLE\" (space $SPACE_KEY)"

          # Render the section inner HTML (Confluence storage format) from tickets.json
          jq -r --arg dash "$DASH_LINK" --arg prov "$PROV" --arg compare "$COMPARE" '
            def esc: gsub("&";"&amp;")|gsub("<";"&lt;")|gsub(">";"&gt;");
            def loz($c;$t): "<ac:structured-macro ac:name=\"status\" ac:schema-version=\"1\"><ac:parameter ac:name=\"colour\">"+$c+"</ac:parameter><ac:parameter ac:name=\"title\">"+($t|esc)+"</ac:parameter></ac:structured-macro>";
            def statusLoz: loz((if .statusCat=="done" then "Green" elif .statusCat=="indeterminate" then "Yellow" else "Grey" end); .status);
            def sourceLoz: (if .source=="both" then ["Green","tagged + merged"] elif .source=="tagged_only" then ["Yellow","not merged"] elif .source=="commit_only" then ["Blue","untagged"] else ["Grey","tagged"] end) as $s | loz($s[0];$s[1]);
            . as $t
            | ($t|length) as $total
            | ([$t[]|select(.statusCat=="done")]|length) as $done
            | ([$t[]|select((.priority|ascii_downcase|test("high")) and .statusCat!="done")]|length) as $hi
            | [$t[]|select(.source=="tagged_only")] as $pending
            | [$t[]|select(.source=="commit_only")] as $missing
            | (if $total>0 then (($done*100/$total)|floor) else 0 end) as $pct
            | ("<p><b>"+($total|tostring)+" tickets</b> · "+($done|tostring)+" done ("+($pct|tostring)+"%) · "+($hi|tostring)+" high-priority open</p>")
            + (if ($pending|length)>0 or ($missing|length)>0 then
                "<ac:structured-macro ac:name=\"info\"><ac:rich-text-body><p><strong>Action items</strong></p>"
                + (if ($pending|length)>0 then "<p>⏳ <b>Tagged but not merged</b> (work pending): "+([$pending[].id]|join(", "))+"</p>" else "" end)
                + (if ($missing|length)>0 then "<p>⚠️ <b>Merged but fix version missing</b> (please set cf[10104]): "+([$missing[].id]|join(", "))+"</p>" else "" end)
                + "</ac:rich-text-body></ac:structured-macro>"
               else "" end)
            + "<p>📊 <a href=\""+$dash+"\">Open in release dashboard</a>" + (if $compare!="" then " · 🔗 <a href=\""+$compare+"\">Commits in this hotfix</a>" else "" end) + "</p>"
            + ( [ $t | group_by(.epicTitle) | .[]
                  | "<h4>"+(.[0].epicTitle|esc)+(if .[0].epic then " ("+.[0].epic+")" else "" end)+" — "+(length|tostring)+" ticket(s)</h4>"
                  + "<table><tbody><tr><th>Ticket</th><th>Title</th><th>Status</th><th>Assignee</th><th>Priority</th><th>Source</th></tr>"
                  + ([ .[] | "<tr><td><a href=\""+.link+"\">"+.id+"</a></td><td>"+(.summary|esc)+"</td><td>"+statusLoz+"</td><td>"+(.assignee|esc)+"</td><td>"+(.priority|esc)+"</td><td>"+sourceLoz+"</td></tr>" ]|join(""))
                  + "</tbody></table>"
                ] | join("") )
            + "<p><em>"+($prov|esc)+"</em></p>"
          ' tickets.json > inner.html

          { printf '<hr/><h2>Release %s</h2><p><b>Date:</b> %s</p>' "$TAG" "$DATE_UTC"; cat inner.html; } > section.html

          TITLE_JSON=$(printf '%s' "$PAGE_TITLE" | jq -Rs .)
          FOUND=$(curl -s -G -u "$CONFLUENCE_EMAIL:$CONFLUENCE_API_TOKEN" \
            --data-urlencode "title=$PAGE_TITLE" --data-urlencode "spaceKey=$SPACE_KEY" \
            --data-urlencode "type=page" --data-urlencode "expand=version,body.storage" \
            "$CONFLUENCE_BASE_URL/wiki/rest/api/content")
          # A valid lookup always has a .results array. Anything else (403 "not permitted",
          # 401, 404, HTML) means a creds/URL/license problem — fail loudly instead of
          # mistaking it for "page not found" and creating a duplicate.
          if ! echo "$FOUND" | jq -e 'has("results")' >/dev/null 2>&1; then
            echo "❌ Confluence lookup failed — check CONFLUENCE_BASE_URL / CONFLUENCE_EMAIL / CONFLUENCE_API_TOKEN"
            echo "   and that the token's account holds a Confluence license on this site."
            echo "$FOUND" | jq '.' 2>/dev/null || echo "$FOUND"
            exit 1
          fi
          PAGE_ID=$(echo "$FOUND" | jq -r '.results[0].id // empty')

          if [ -n "$PAGE_ID" ]; then
            VERSION=$(echo "$FOUND" | jq -r '.results[0].version.number')
            echo "$FOUND" | jq -r '.results[0].body.storage.value' > existing.html
            # Idempotency: drop any existing section for THIS tag, then prepend the fresh one
            TAG="$TAG" perl -0777 -pe 'my $t=quotemeta($ENV{"TAG"}); s/<hr\s*\/?>\s*<h2>Release $t<\/h2>.*?(?=<hr\s*\/?>|\z)//s' existing.html > cleaned.html
            NEW_VERSION=$((VERSION + 1))
            cat section.html cleaned.html > final.html
            ESCAPED=$(jq -Rs . < final.html)
            echo "Found \"$PAGE_TITLE\" (id=$PAGE_ID, v$VERSION) — replacing Release $TAG → v$NEW_VERSION"
            RESULT=$(curl -s -u "$CONFLUENCE_EMAIL:$CONFLUENCE_API_TOKEN" -X PUT \
              "$CONFLUENCE_BASE_URL/wiki/rest/api/content/$PAGE_ID" -H "Content-Type: application/json" \
              -d "{\"id\":\"$PAGE_ID\",\"type\":\"page\",\"title\":$TITLE_JSON,\"version\":{\"number\":$NEW_VERSION},\"body\":{\"storage\":{\"value\":$ESCAPED,\"representation\":\"storage\"}}}")
          else
            echo "No page titled \"$PAGE_TITLE\" — creating and populating it"
            ESCAPED=$(jq -Rs . < section.html)
            RESULT=$(curl -s -u "$CONFLUENCE_EMAIL:$CONFLUENCE_API_TOKEN" -X POST \
              -H "Content-Type: application/json" \
              -d "{\"type\":\"page\",\"title\":$TITLE_JSON,\"space\":{\"key\":\"$SPACE_KEY\"},\"body\":{\"storage\":{\"value\":$ESCAPED,\"representation\":\"storage\"}}}" \
              "$CONFLUENCE_BASE_URL/wiki/rest/api/content")
            PAGE_ID=$(echo "$RESULT" | jq -r '.id // empty')
          fi

          if [ -z "$PAGE_ID" ] || [ "$(echo "$RESULT" | jq -r '.id // empty')" = "" ]; then
            echo "❌ Confluence update/create failed:"; echo "$RESULT" | jq '.' 2>/dev/null || echo "$RESULT"; exit 1
          fi
          echo "CONF_PAGE_ID=$PAGE_ID" >> "$GITHUB_ENV"
          echo "CONFLUENCE_URL=$CONFLUENCE_BASE_URL/wiki/pages/viewpage.action?pageId=$PAGE_ID" >> "$GITHUB_ENV"
          echo "✅ \"$PAGE_TITLE\" id=$PAGE_ID is now v$(echo "$RESULT" | jq -r '.version.number')"

      # ✅ Create tag
      - name: Create tag
        run: |
          git tag ${{ steps.tag.outputs.new_tag }}
          git push origin ${{ steps.tag.outputs.new_tag }}

      # ✅ Publish dashboard release data (GitHub Pages source = docs/** on the default branch)
      #    Builds docs/data/releases.json for this tag (empty block if 0 tickets, so the cut
      #    is still recorded) and commits it to master, which triggers pages.yml to redeploy.
      - name: Publish dashboard release data
        run: |
          set -euo pipefail
          export COMMIT_IDS="$(paste -sd' ' commit_ids.txt 2>/dev/null || true)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          # Switch to master FIRST (only untracked work files exist here, so this is clean), then
          # build — so the merge base is master's releases.json, not the sprint branch's copy.
          # -f is defensive in case a tracked file was touched earlier in the job.
          git checkout -f -B master origin/master
          echo "Building dashboard data for ${{ steps.tag.outputs.new_tag }} (COMMIT_IDS='$COMMIT_IDS')"
          bash scripts/build-release-data.sh "${{ steps.tag.outputs.new_tag }}"
          git add docs/data/releases.json
          if git diff --cached --quiet; then
            echo "No dashboard changes to publish."
          else
            git commit -m "chore(dashboard): record release ${{ steps.tag.outputs.new_tag }}"
            git push origin master
            echo "✅ Dashboard data published to master → pages.yml will redeploy."
          fi

      # ✅ Send Teams Notification
      - name: Send Teams Notification
        if: success()
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}

        run: |
          TAG_NAME="${{ steps.tag.outputs.new_tag }}"

          DASHBOARD_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          # CONF_PAGE_ID was exported by the "Update Confluence" step (find-or-create by line)
          CONFLUENCE_URL="$CONFLUENCE_BASE_URL/wiki/pages/viewpage.action?pageId=${CONF_PAGE_ID}"

          jq -n \
            --arg tag  "$TAG_NAME"      \
            --arg conf "$CONFLUENCE_URL" \
            --arg dash "$DASHBOARD_URL"  \
            '{
              type: "message",
              attachments: [
                {
                  contentType: "application/vnd.microsoft.card.adaptive",
                  content: {
                    "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                    type: "AdaptiveCard",
                    version: "1.4",
                    body: [
                      {
                        type: "TextBlock",
                        size: "Large",
                        weight: "Bolder",
                        text: "🚀 Release Successfully Created"
                      },
                      {
                        type: "TextBlock",
                        text: ("Tag: " + $tag)
                      }
                    ],
                    actions: [
                      {
                        type: "Action.OpenUrl",
                        title: "📄 Confluence",
                        url: $conf
                      },
                      {
                        type: "Action.OpenUrl",
                        title: "📊 Dashboard",
                        url: $dash
                      }
                    ]
                  }
                }
              ]
            }' > payload.json

          curl --location --request POST "$TEAMS_WEBHOOK_URL" \
            --header "Content-Type: application/json" \
            --data @payload.json
