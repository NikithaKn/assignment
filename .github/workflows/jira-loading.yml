name: Jira Release Dashboard

# Fetches every Jira ticket associated with a release tag via customfield_10104,
# builds the enriched docs/data/releases.json (accumulating one block per tag under
# its release branch), commits it, and publishes the docs/ dashboard to GitHub Pages.
#
# One dispatch = fetch → structured data → commit → deploy.

on:
  workflow_dispatch:
    inputs:
      fix_version:
        description: 'Release tag / Jira fix version (e.g. 26.7.0)'
        required: true
        type: string
        default: '26.7.0'

# Credentials: pulled from repo secrets when configured. If a secret is unset/empty,
# scripts/build-release-data.sh falls back to its hardcoded POC values, so this
# workflow runs out-of-the-box against the POC and switches to secrets in prod.
env:
  JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
  JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
  JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

permissions:
  contents: write   # commit releases.json
  pages: write      # deploy Pages
  id-token: write   # required by deploy-pages

# Avoid overlapping Pages deployments
concurrency:
  group: jira-release-dashboard
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build structured release data (docs/data/releases.json)
        run: |
          chmod +x scripts/build-release-data.sh
          ./scripts/build-release-data.sh "${{ inputs.fix_version }}"

      - name: Commit updated dashboard data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/releases.json docs/index.html
          if git diff --cached --quiet; then
            echo "ℹ️  No dashboard changes to commit"
          else
            git commit -m "chore: release dashboard data for ${{ inputs.fix_version }}"
            git push
            echo "✅ Committed and pushed dashboard update"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
