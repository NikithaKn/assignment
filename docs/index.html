<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Sprint Release Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0f12;--surface:#13161b;--surface2:#1a1e25;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#e8eaf0;--muted:#7a8099;
  --accent:#4f7fff;--accent-dim:rgba(79,127,255,0.12);
  --done:#22c55e;--done-dim:rgba(34,197,94,0.12);
  --progress:#f59e0b;--progress-dim:rgba(245,158,11,0.12);
  --review:#a78bfa;--review-dim:rgba(167,139,250,0.12);
  --mono:"IBM Plex Mono",monospace;--sans:"DM Sans",sans-serif;
  --r:10px;--rs:6px;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;min-height:100vh}
header{border-bottom:1px solid var(--border);padding:0 2rem;height:56px;display:flex;align-items:center;position:sticky;top:0;background:var(--bg);z-index:100}
.logo{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--accent);letter-spacing:.04em}
.logo span{color:var(--muted)}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 56px)}
aside{border-right:1px solid var(--border);padding:1.5rem 0;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto}
aside h3{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 1.25rem;margin-bottom:8px}
.ri{display:flex;flex-direction:column;gap:2px;padding:10px 1.25rem;cursor:pointer;border-left:2px solid transparent;transition:background .15s,border-color .15s}
.ri:hover{background:var(--surface)}
.ri.active{border-left-color:var(--accent);background:var(--surface)}
.ri .rv{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--text)}
.ri .rd{font-size:11px;color:var(--muted)}
.ri .rp{display:flex;align-items:center;gap:6px;margin-top:4px}
.mini-bar{flex:1;height:3px;background:var(--border2);border-radius:99px;overflow:hidden}
.mini-fill{height:100%;background:var(--done);border-radius:99px}
.mini-pct{font-size:10px;font-family:var(--mono);color:var(--muted);min-width:28px;text-align:right}
main{padding:2rem 2.5rem;max-width:1040px}
.rh{margin-bottom:2rem;animation:fu .3s ease both}
.rt{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.rt h1{font-family:var(--mono);font-size:26px;font-weight:500;letter-spacing:-.02em}
.bb{font-family:var(--mono);font-size:11px;padding:3px 8px;background:var(--accent-dim);color:var(--accent);border-radius:var(--rs);border:1px solid rgba(79,127,255,.2)}
.rm{font-size:12px;color:var(--muted);margin-bottom:1.5rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:2rem;animation:fu .3s .05s ease both}
.sc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.sc .lbl{font-size:11px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.sc .val{font-family:var(--mono);font-size:22px;font-weight:500}
.pw{margin-bottom:2rem;animation:fu .3s .1s ease both}
.pl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px;font-family:var(--mono);letter-spacing:.04em}
.pb{height:6px;background:var(--border2);border-radius:99px;overflow:hidden}
.pf{height:100%;border-radius:99px;background:var(--done);transition:width .6s cubic-bezier(.4,0,.2,1)}
.epics{margin-bottom:2rem;animation:fu .3s .12s ease both}
.epics h2{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.epic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.epic-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px}
.ec-key{font-family:var(--mono);font-size:11px;color:var(--accent);margin-bottom:4px}
.ec-title{font-size:13px;font-weight:500;color:var(--text);margin-bottom:4px}
.ec-short{font-size:12px;color:var(--muted);line-height:1.4}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.5rem;animation:fu .3s .14s ease both}
.fb{font-family:var(--mono);font-size:11px;padding:5px 12px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--rs);color:var(--muted);cursor:pointer;transition:all .15s;letter-spacing:.04em}
.fb:hover,.fb.active{background:var(--accent-dim);border-color:rgba(79,127,255,.3);color:var(--accent)}
.sb{margin-left:auto;display:flex;align-items:center;background:var(--surface);border:1px solid var(--border2);border-radius:var(--rs);padding:5px 10px;gap:6px}
.sb input{background:none;border:none;outline:none;font-family:var(--mono);font-size:11px;color:var(--text);width:160px}
.sb input::placeholder{color:var(--muted)}
table.tt{width:100%;border-collapse:collapse;animation:fu .3s .16s ease both}
table.tt thead tr{border-bottom:1px solid var(--border2)}
table.tt th{text-align:left;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 12px 10px}
table.tt th:first-child{padding-left:0}
.tr{border-bottom:1px solid var(--border);transition:background .15s}
.tr:hover{background:var(--surface)}
.tr.hidden{display:none}
.tr td{padding:12px;vertical-align:top}
.tr td:first-child{padding-left:0}
.tid{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--accent);text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.tid:hover{text-decoration:underline}
.tsm{font-size:13px;color:var(--text);line-height:1.4}
.badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:var(--rs);white-space:nowrap;letter-spacing:.02em}
.badge::before{content:"";width:5px;height:5px;border-radius:50%;flex-shrink:0}
.b-done{background:var(--done-dim);color:var(--done)}.b-done::before{background:var(--done)}
.b-prog{background:var(--progress-dim);color:var(--progress)}.b-prog::before{background:var(--progress)}
.b-rev{background:var(--review-dim);color:var(--review)}.b-rev::before{background:var(--review)}
.b-todo{background:rgba(100,116,139,.12);color:var(--muted)}.b-todo::before{background:#64748b}
.type-b{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:var(--rs);background:var(--surface2);color:var(--muted);border:1px solid var(--border);letter-spacing:.04em}
.conf-link{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;color:var(--accent);text-decoration:none;padding:4px 10px;border:1px solid rgba(79,127,255,.25);border-radius:var(--rs);background:var(--accent-dim)}
.conf-link:hover{background:rgba(79,127,255,.2)}
.empty{text-align:center;padding:5rem 2rem;color:var(--muted);font-family:var(--mono);font-size:13px;animation:fu .3s ease both}
.empty .big{font-size:36px;margin-bottom:12px;opacity:.3}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:760px){
  .shell{grid-template-columns:1fr}
  aside{position:static;height:auto;border-right:none;border-bottom:1px solid var(--border)}
  main{padding:1.25rem}
  .stats{grid-template-columns:repeat(2,1fr)}
  .tt th:nth-child(4),.tt td:nth-child(4),.tt th:nth-child(5),.tt td:nth-child(5){display:none}
}
</style>
</head>
<body>
<header>
  <span class="logo">sprint<span>/</span>releases</span>
</header>
<div class="shell">
  <aside id="sidebar">
    <h3>Releases</h3>
    <div id="release-list"><div class="empty" style="padding:2rem 1.25rem;font-size:11px">Loading...</div></div>
  </aside>
  <main id="main-content">
    <div class="empty"><div class="big">&#9678;</div><div>Select a release from the sidebar</div></div>
  </main>
</div>
<script>
function statusClass(s) {
  var n = (s || "").toLowerCase();
  if (n === "done" || n === "closed" || n === "resolved") return "b-done";
  if (n.indexOf("progress") >= 0 || n.indexOf("active") >= 0) return "b-prog";
  if (n.indexOf("review") >= 0 || n.indexOf("testing") >= 0 || n.indexOf("qa") >= 0) return "b-rev";
  return "b-todo";
}
function statusGroup(s) {
  var c = statusClass(s);
  if (c === "b-done") return "done";
  if (c === "b-prog") return "in-progress";
  if (c === "b-rev") return "review";
  return "todo";
}
function fmtDate(iso) {
  if (!iso) return "--";
  var d = new Date(iso);
  return d.toLocaleDateString("en-GB", {day:"numeric", month:"short", year:"numeric"});
}
function extIcon() {
  return "<svg width=\"10\" height=\"10\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6\"/><polyline points=\"15 3 21 3 21 9\"/><line x1=\"10\" y1=\"14\" x2=\"21\" y2=\"3\"/></svg>";
}

var activeFilter = "all";
var searchQuery = "";

async function loadSidebar() {
  var idx;
  try {
    var r = await fetch("data/releases.json?" + Date.now());
    if (!r.ok) throw new Error("HTTP " + r.status);
    idx = await r.json();
  } catch(e) {
    document.getElementById("release-list").innerHTML = "<div class=\"empty\" style=\"padding:1.25rem;font-size:11px;color:#ef4444\">Could not load data/releases.json: " + e.message + "</div>";
    return;
  }

  var releases = (idx.releases || []);
  if (!releases.length) {
    document.getElementById("release-list").innerHTML = "<div class=\"empty\" style=\"padding:1.25rem;font-size:11px\">No releases yet</div>";
    return;
  }

  var list = document.getElementById("release-list");
  list.innerHTML = "";
  releases.forEach(function(rel, i) {
    var done = rel.tickets_done || 0;
    var total = rel.ticket_count || 0;
    var pct = total ? Math.round(done / total * 100) : 0;
    var el = document.createElement("div");
    el.className = "ri" + (i === 0 ? " active" : "");
    el.innerHTML = "<span class=\"rv\">" + rel.tag + "</span><span class=\"rd\">" + fmtDate(rel.date) + "</span><div class=\"rp\"><div class=\"mini-bar\"><div class=\"mini-fill\" style=\"width:" + pct + "%\"></div></div><span class=\"mini-pct\">" + pct + "%</span></div>";
    el.addEventListener("click", (function(r) {
      return function() {
        document.querySelectorAll(".ri").forEach(function(e) { e.classList.remove("active"); });
        el.classList.add("active");
        renderRelease(r);
      };
    })(rel));
    list.appendChild(el);
  });
  if (releases[0]) renderRelease(releases[0]);
}

function renderRelease(rel) {
  var tickets = rel.tickets || [];
  var epics = rel.epics || [];
  var total = tickets.length;
  var done = tickets.filter(function(t) { return statusGroup(t.status) === "done"; }).length;
  var inP = tickets.filter(function(t) { return statusGroup(t.status) === "in-progress"; }).length;
  var pct = total ? Math.round(done / total * 100) : 0;
  var confUrl = rel.confluence || "";

  function countGroup(g) { return tickets.filter(function(t) { return statusGroup(t.status) === g; }).length; }

  var epicHtml = "";
  if (epics.length) {
    epicHtml = "<div class=\"epics\"><h2>Epic highlights</h2><div class=\"epic-grid\">";
    epics.forEach(function(e) {
      epicHtml += "<div class=\"epic-card\"><div class=\"ec-key\">" + e.epic + "</div><div class=\"ec-title\">" + (e.title || "") + "</div><div class=\"ec-short\">" + (e.short || "") + "</div></div>";
    });
    epicHtml += "</div></div>";
  }

  var tableHtml = "";
  if (total === 0) {
    tableHtml = "<div class=\"empty\"><div class=\"big\">&#8709;</div><div>No Jira tickets found for this release</div></div>";
  } else {
    var rowsHtml = "";
    tickets.forEach(function(t) {
      rowsHtml += "<tr class=\"tr\" data-g=\"" + statusGroup(t.status) + "\" data-id=\"" + t.id.toLowerCase() + "\" data-sm=\"" + (t.summary || "").toLowerCase().replace(/"/g, "&quot;") + "\">" +
        "<td><a class=\"tid\" href=\"" + t.link + "\" target=\"_blank\" rel=\"noopener\">" + t.id + " " + extIcon() + "</a></td>" +
        "<td><div class=\"tsm\">" + (t.summary || "") + "</div></td>" +
        "<td><span class=\"badge " + statusClass(t.status) + "\">" + t.status + "</span></td>" +
        "<td><span class=\"type-b\">" + (t.type || "") + "</span></td>" +
        "<td style=\"font-size:12px;color:var(--muted)\">" + (t.assignee || "") + "</td></tr>";
    });
    tableHtml = "<table class=\"tt\"><thead><tr><th style=\"width:110px\">Ticket</th><th>Summary</th><th style=\"width:130px\">Status</th><th style=\"width:90px\">Type</th><th style=\"width:100px\">Assignee</th></tr></thead><tbody id=\"tbody\">" + rowsHtml + "</tbody></table>";
  }

  document.getElementById("main-content").innerHTML =
    "<div class=\"rh\">" +
      "<div class=\"rt\"><h1>" + rel.tag + "</h1><span class=\"bb\">" + (rel.branch || "") + "</span></div>" +
      "<div class=\"rm\">Released " + fmtDate(rel.date) + " &middot; " + total + " ticket" + (total !== 1 ? "s" : "") + " &middot; " + epics.length + " epic" + (epics.length !== 1 ? "s" : "") + "</div>" +
      (confUrl ? "<a class=\"conf-link\" href=\"" + confUrl + "\" target=\"_blank\" rel=\"noopener\">" + extIcon() + " Confluence release notes</a>" : "") +
    "</div>" +
    "<div class=\"stats\">" +
      "<div class=\"sc\"><div class=\"lbl\">Total</div><div class=\"val\" style=\"color:var(--text)\">" + total + "</div></div>" +
      "<div class=\"sc\"><div class=\"lbl\">Done</div><div class=\"val\" style=\"color:var(--done)\">" + done + "</div></div>" +
      "<div class=\"sc\"><div class=\"lbl\">In progress</div><div class=\"val\" style=\"color:var(--progress)\">" + inP + "</div></div>" +
      "<div class=\"sc\"><div class=\"lbl\">Completion</div><div class=\"val\" style=\"color:" + (pct === 100 ? "var(--done)" : "var(--text)") + "\">" + pct + "%</div></div>" +
    "</div>" +
    "<div class=\"pw\"><div class=\"pl\"><span>Release progress</span><span>" + done + " / " + total + "</span></div><div class=\"pb\"><div class=\"pf\" id=\"pf\" style=\"width:0%\"></div></div></div>" +
    epicHtml +
    "<div class=\"filters\">" +
      "<button class=\"fb active\" data-f=\"all\">All <span style=\"opacity:.5\">" + total + "</span></button>" +
      "<button class=\"fb\" data-f=\"done\">Done <span style=\"opacity:.5\">" + done + "</span></button>" +
      "<button class=\"fb\" data-f=\"in-progress\">In Progress <span style=\"opacity:.5\">" + inP + "</span></button>" +
      "<button class=\"fb\" data-f=\"review\">Review <span style=\"opacity:.5\">" + countGroup("review") + "</span></button>" +
      "<button class=\"fb\" data-f=\"todo\">To Do <span style=\"opacity:.5\">" + countGroup("todo") + "</span></button>" +
      "<div class=\"sb\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"/></svg><input id=\"si\" type=\"text\" placeholder=\"Search tickets...\"/></div>" +
    "</div>" +
    tableHtml;

  requestAnimationFrame(function() { var f = document.getElementById("pf"); if (f) f.style.width = pct + "%"; });
  activeFilter = "all";
  searchQuery = "";

  document.querySelectorAll(".fb").forEach(function(b) {
    b.addEventListener("click", function() {
      document.querySelectorAll(".fb").forEach(function(x) { x.classList.remove("active"); });
      b.classList.add("active");
      activeFilter = b.dataset.f;
      applyFilter();
    });
  });
  var si = document.getElementById("si");
  if (si) si.addEventListener("input", function(e) { searchQuery = e.target.value; applyFilter(); });
}

function applyFilter() {
  document.querySelectorAll(".tr").forEach(function(r) {
    var gm = activeFilter === "all" || r.dataset.g === activeFilter;
    var q = searchQuery.toLowerCase();
    var sm = !q || r.dataset.id.indexOf(q) >= 0 || r.dataset.sm.indexOf(q) >= 0;
    r.classList.toggle("hidden", !(gm && sm));
  });
}

loadSidebar();
</script>
</body>
</html>
